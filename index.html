<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Vollbildmodus, wenn die App vom Home-Bildschirm gestartet wird -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lern-App">
  <title>Lern-App</title>
    <style>
    :root {
      --creme: #f6f0e4;
      --papier: #fffdf8;
      --braun: #3e2b20;
      --braun-hell: #8a6d55;
      --weinrot: #6e1f2b;
      --gold: #b39461;
      --gold-hell: #ddcfb2;
      --richtig-bg: #e4e8d6;
      --richtig-rand: #5b6b3c;
      --falsch-bg: #f1dcdc;
      --falsch-rand: #8e2a35;
    }
    body {
      font-family: "Baskerville", "Georgia", "Times New Roman", serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 14px;
      background: var(--creme);
      color: var(--braun);
    }
    h1 {
      text-align: center;
      font-size: 21px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--weinrot);
      margin: 6px 0 2px;
    }
    /* Zierlinie unter dem Titel */
    .zier {
      text-align: center;
      color: var(--gold);
      font-size: 14px;
      margin: 0 0 10px;
    }
    .zier::before, .zier::after {
      content: "";
      display: inline-block;
      width: 50px;
      border-top: 1px solid var(--gold);
      vertical-align: middle;
      margin: 0 8px;
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      margin: 6px 0 10px;
    }
    .info {
      color: var(--braun-hell);
      font-size: 14px;
      font-variant: small-caps;
      letter-spacing: 0.05em;
      margin: 4px 0;
    }
    .badge { color: var(--weinrot); font-weight: bold; }
    .antwort {
      display: block;
      width: 100%;
      padding: 11px 12px;
      margin: 6px 0;
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      border: 2px solid var(--gold-hell);
      border-radius: 4px;
      background: var(--papier);
      color: var(--braun);
      box-shadow: 0 1px 2px rgba(62, 43, 32, 0.08);
    }
    /* Text bleibt nach dem Antworten gut lesbar */
    .antwort:disabled {
      color: var(--braun);
      opacity: 1;
      -webkit-text-fill-color: var(--braun);
    }
    .richtig { background: var(--richtig-bg); border-color: var(--richtig-rand); }
    .falsch  { background: var(--falsch-bg);  border-color: var(--falsch-rand); }
    .erklaerung {
      background: #f1e7d2;
      border-left: 3px solid var(--gold);
      padding: 8px 10px;
      margin: 10px 0 0;
      border-radius: 2px;
      font-size: 15px;
      font-style: italic;
    }
    .weiter {
      width: 100%;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: none;
      border-radius: 4px;
      background: var(--weinrot);
      color: #fbf6ec;
      margin-top: 8px;
    }
    .klein {
      display: block;
      margin: 20px auto 0;
      background: none;
      border: none;
      font-family: inherit;
      color: var(--braun-hell);
      font-size: 14px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Lern-App</h1>
  <p class="zier">❦</p>
  <div id="quiz"></div>

  <!-- Zuerst den Fragenkatalog laden, dann die App-Logik -->
    <script src="fragen.js?v=2"></script>
    <script>
    // ===== Einstellungen =====
    const FRAGEN_PRO_RUNDE = 10;     // wie viele Fragen pro Runde
    const RICHTIG_ZUM_ABHAKEN = 2;   // so oft hintereinander richtig, bis eine Frage als gelernt gilt

    // ===== Hilfsfunktion: Liste zufällig mischen =====
    // Gibt eine gemischte Kopie zurück, die Originalliste bleibt unverändert.
    function mische(liste) {
      const kopie = liste.slice();
      for (let i = kopie.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
      }
      return kopie;
    }

    // ===== Lernstand laden und speichern =====
    function ladeLernstand() {
      try {
        return JSON.parse(localStorage.getItem("lernstand")) || {};
      } catch (fehler) {
        return {};
      }
    }

    function speichereLernstand() {
      try {
        localStorage.setItem("lernstand", JSON.stringify(lernstand));
      } catch (fehler) {
        // Falls Speichern nicht klappt, läuft die App trotzdem weiter
      }
    }

    let lernstand = ladeLernstand();

    function istOffen(id) {
      return lernstand[id] && lernstand[id].offen;
    }

    function aktualisiereLernstand(id, istRichtig) {
      const eintrag = lernstand[id] || { offen: false, richtigInFolge: 0 };

      if (istRichtig) {
        eintrag.richtigInFolge++;
        if (eintrag.richtigInFolge >= RICHTIG_ZUM_ABHAKEN) {
          eintrag.offen = false;
        }
      } else {
        eintrag.offen = true;
        eintrag.richtigInFolge = 0;
      }

      lernstand[id] = eintrag;
      speichereLernstand();
    }

    // ===== Runde zusammenstellen =====
    // Offene Fragen zuerst (gemischt), dann zufällig aufgefüllt.
    function stelleRundeZusammen() {
      const offene = mische(FRAGEN.filter(f => istOffen(f.id)));
      const uebrige = mische(FRAGEN.filter(f => !istOffen(f.id)));
      return offene.concat(uebrige).slice(0, FRAGEN_PRO_RUNDE);
    }

    const runde = stelleRundeZusammen();
    let aktuelleFrage = 0;
    let punkte = 0;
    let reihenfolge = [];    // in welcher Reihenfolge die Antworten gerade angezeigt werden
    const ergebnisse = [];

    // ===== Anzeige =====
    function zeigeFrage() {
      const bereich = document.getElementById("quiz");

      if (aktuelleFrage >= runde.length) {
        zeigeErgebnis();
        return;
      }

      const f = runde[aktuelleFrage];
      const markierung = istOffen(f.id) ? ` · <span class="badge">🔁 Wiederholung</span>` : "";

      // Antworten mischen: z. B. [2, 0, 3, 1]
      reihenfolge = mische(f.antworten.map((antwort, i) => i));

      let html = `<p class="info">Frage ${aktuelleFrage + 1} von ${runde.length} · ${f.epoche}${markierung}</p>`;
      html += `<h2>${f.frage}</h2>`;

      reihenfolge.forEach((original) => {
        html += `<button class="antwort" onclick="pruefeAntwort(${original})">${f.antworten[original]}</button>`;
      });

      bereich.innerHTML = html;
    }

    function pruefeAntwort(gewaehlt) {
      const f = runde[aktuelleFrage];
      const istRichtig = (gewaehlt === f.richtig);
      if (istRichtig) punkte++;

      ergebnisse.push({ frage: f, gewaehlt: gewaehlt, istRichtig: istRichtig });
      aktualisiereLernstand(f.id, istRichtig);

      // Buttons stehen in gemischter Reihenfolge, deshalb über "reihenfolge" zuordnen
      const buttons = document.querySelectorAll(".antwort");
      buttons.forEach((button, position) => {
        const original = reihenfolge[position];
        button.disabled = true;
        if (original === f.richtig) button.classList.add("richtig");
        else if (original === gewaehlt) button.classList.add("falsch");
      });

      const bereich = document.getElementById("quiz");
      bereich.insertAdjacentHTML("beforeend",
        `<p class="erklaerung">${istRichtig ? "Richtig! " : "Leider falsch. "}${f.erklaerung}</p>
         <button class="weiter" onclick="naechsteFrage()">Weiter</button>`);
    }

    function naechsteFrage() {
      aktuelleFrage++;
      zeigeFrage();
    }

    function zeigeErgebnis() {
      const nochOffen = FRAGEN.filter(f => istOffen(f.id)).length;

      let html = `<h2>Geschafft! ${punkte} von ${runde.length} richtig</h2>`;
      html += `<p class="info">Noch zu üben: ${nochOffen} ${nochOffen === 1 ? "Frage" : "Fragen"}</p>`;

      ergebnisse.forEach((e) => {
        html += `<p><strong>${e.istRichtig ? "✅" : "❌"} ${e.frage.frage}</strong><br>
                 Richtige Antwort: ${e.frage.antworten[e.frage.richtig]}</p>`;
      });

      html += `<button class="weiter" onclick="location.reload()">Nochmal</button>`;
      html += `<button class="klein" onclick="zuruecksetzen()">Lernstand zurücksetzen</button>`;
      document.getElementById("quiz").innerHTML = html;
    }

    function zuruecksetzen() {
      if (confirm("Lernstand wirklich löschen?")) {
        lernstand = {};
        speichereLernstand();
        location.reload();
      }
    }

    // Beim Laden der Seite mit der ersten Frage starten
    zeigeFrage();
  </script>
</body>
</html>
