<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Vollbildmodus, wenn die App vom Home-Bildschirm gestartet wird -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lern-App">
  <title>Lern-App</title>
  <style>
    :root {
      --creme: #f6f0e4;
      --papier: #fffdf8;
      --braun: #3e2b20;
      --braun-hell: #8a6d55;
      --weinrot: #6e1f2b;
      --gold: #b39461;
      --gold-hell: #ddcfb2;
      --richtig-bg: #e4e8d6;
      --richtig-rand: #5b6b3c;
      --falsch-bg: #f1dcdc;
      --falsch-rand: #8e2a35;
    }
    body {
      font-family: "Baskerville", "Georgia", "Times New Roman", serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 10px 14px;
      background: var(--creme);
      color: var(--braun);
    }
    /* Kopfbereich: Titel, Zierlinie und der kleine "Zurück"-Knopf links oben */
    header { position: relative; }
    .zurueckknopf {
      position: absolute;
      left: 0;
      top: 6px;
      background: none;
      border: none;
      padding: 2px 0;
      font-family: inherit;
      font-size: 14px;
      color: var(--braun-hell);
    }
    h1 {
      text-align: center;
      font-size: 21px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--weinrot);
      margin: 6px 0 2px;
    }
    /* Zierlinie unter dem Titel */
    .zier {
      text-align: center;
      color: var(--gold);
      font-size: 14px;
      margin: 0 0 10px;
    }
    .zier::before, .zier::after {
      content: "";
      display: inline-block;
      width: 50px;
      border-top: 1px solid var(--gold);
      vertical-align: middle;
      margin: 0 8px;
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
      margin: 6px 0 10px;
    }
    .info {
      color: var(--braun-hell);
      font-size: 14px;
      font-variant: small-caps;
      letter-spacing: 0.05em;
      margin: 4px 0;
    }
    .badge { color: var(--weinrot); font-weight: bold; }
    .antwort {
      display: block;
      width: 100%;
      padding: 11px 12px;
      margin: 6px 0;
      font-family: inherit;
      font-size: 16px;
      text-align: left;
      border: 2px solid var(--gold-hell);
      border-radius: 4px;
      background: var(--papier);
      color: var(--braun);
      box-shadow: 0 1px 2px rgba(62, 43, 32, 0.08);
    }
    /* Text bleibt nach dem Antworten gut lesbar */
    .antwort:disabled {
      color: var(--braun);
      opacity: 1;
      -webkit-text-fill-color: var(--braun);
    }
    .richtig { background: var(--richtig-bg); border-color: var(--richtig-rand); }
    .falsch  { background: var(--falsch-bg);  border-color: var(--falsch-rand); }
    .erklaerung {
      background: #f1e7d2;
      border-left: 3px solid var(--gold);
      padding: 8px 10px;
      margin: 10px 0 0;
      border-radius: 2px;
      font-size: 15px;
      font-style: italic;
    }
    .weiter {
      width: 100%;
      padding: 13px;
      font-family: inherit;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      border: 2px solid var(--weinrot);
      border-radius: 4px;
      background: var(--weinrot);
      color: #fbf6ec;
      margin-top: 8px;
    }
    /* Zweitrangiger Knopf: gleiche Form, aber hell */
    .weiter.hell {
      background: var(--papier);
      color: var(--weinrot);
    }
    .klein {
      display: block;
      margin: 20px auto 0;
      background: none;
      border: none;
      font-family: inherit;
      color: var(--braun-hell);
      font-size: 14px;
      text-decoration: underline;
    }

    /* ===== Knöpfe für Themen, Fächer und Stationen ===== */
    .station, .fach, .tagesthema {
      display: block;
      width: 100%;
      padding: 10px 12px;
      margin: 7px 0;
      font-family: inherit;
      font-size: 17px;
      text-align: left;
      border: 2px solid var(--gold-hell);
      border-radius: 4px;
      background: var(--papier);
      color: var(--braun);
      box-shadow: 0 1px 2px rgba(62, 43, 32, 0.08);
    }
    /* Kleine Unterzeile im Knopf */
    .station span, .fach span, .tagesthema span {
      display: block;
      font-size: 13px;
      font-style: italic;
      color: var(--braun-hell);
      margin-top: 2px;
    }
    /* Status "Test bestanden" in Grün */
    .station span.bestanden, .tagesthema span.bestanden { color: var(--richtig-rand); }

    /* Fächer als Kacheln in zwei Spalten */
    .faecher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0 12px;
    }
    .fach { margin: 0; }

    /* ===== Abschnitte auf dem Startbildschirm ===== */
    /* Überschrift: Großbuchstaben, Buchstabenabstand, Weinrot. Darunter steht
       das Gold-Ornament (Klasse "zier", wie unter dem App-Titel). */
    .abschnitt {
      text-align: center;
      font-size: 15px;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--weinrot);
      margin: 30px 0 2px;
    }
    /* Der erste Abschnitt braucht oben nicht so viel Abstand */
    #inhalt > .abschnitt:first-child { margin-top: 14px; }

    /* Thema des Tages: hervorgehoben mit goldenem Rahmen */
    .tagesthema {
      border-color: var(--gold);
      background: linear-gradient(180deg, var(--papier), #f8f0df);
      padding: 12px 14px;
    }
    /* Oben das Fach: klein, in Kapitälchen */
    .tagesthema .tages-fach {
      font-style: normal;
      font-variant: small-caps;
      letter-spacing: 0.08em;
      margin: 0 0 2px;
    }
    /* In der Mitte das Thema: groß und deutlich */
    .tagesthema .tages-titel {
      font-style: normal;
      font-size: 20px;
      font-weight: 600;
      color: var(--braun);
      margin: 0 0 3px;
    }

    /* Hinweis bei Ladefehlern – nur lokal am Laptop sichtbar */
    .hinweis {
      margin-top: 16px;
      padding: 8px 10px;
      border: 1px dashed var(--falsch-rand);
      background: var(--falsch-bg);
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: var(--braun);
    }
    .hinweis p { margin: 4px 0; }

    /* ===== Einführung ===== */
    .einfuehrung p { margin: 8px 0; line-height: 1.4; font-size: 16px; }
    .einfuehrung .beispiel {
      background: #f1e7d2;
      border-left: 3px solid var(--gold);
      padding: 8px 10px;
      border-radius: 2px;
    }
    .einfuehrung .formel {
      text-align: center;
      font-size: 21px;
      color: var(--weinrot);
      margin: 10px 0;
    }
    .wertetabelle { border-collapse: collapse; margin: 8px auto; }
    .wertetabelle th, .wertetabelle td {
      border: 1px solid var(--gold-hell);
      background: var(--papier);
      padding: 4px 12px;
      text-align: center;
    }
    .wertetabelle th { color: var(--weinrot); }
    /* Zeichnung (SVG) */
    .skizze { display: block; width: 100%; max-width: 220px; height: auto; margin: 4px auto; }
    .skizze .gitter  { stroke: var(--gold-hell); stroke-width: 0.7; fill: none; }
    .skizze .achse   { stroke: var(--braun); stroke-width: 1.2; fill: none; }
    .skizze .gerade  { stroke: var(--weinrot); stroke-width: 2; }
    .skizze .dreieck { stroke: var(--gold); stroke-width: 2.5; fill: none; }
    .skizze text     { fill: var(--braun); font-size: 11px; font-family: inherit; }
    /* "Pyramide" aus Kästchen (z. B. Ständegesellschaft) */
    .pyramide { margin: 8px 0; text-align: center; font-size: 14px; line-height: 1.3; }
    .pyramide div {
      margin: 3px auto;
      padding: 4px;
      background: var(--papier);
      border: 1px solid var(--gold);
      border-radius: 3px;
    }
    /* Zurück/Weiter nebeneinander */
    .nav { display: flex; gap: 8px; }
    .nav .weiter { flex: 1; }

    /* ===== Punkteleiste und Belohnung ===== */
    .punkteleiste { margin: 0 0 10px; }
    .punkte-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-variant: small-caps;
      letter-spacing: 0.05em;
      color: var(--braun-hell);
      margin-bottom: 4px;
    }
    .balken {
      height: 8px;
      background: var(--papier);
      border: 1px solid var(--gold-hell);
      border-radius: 4px;
      overflow: hidden;
    }
    .balken-fuellung {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--weinrot));
      transition: width 0.6s ease;
    }
    .belohnung {
      background: var(--papier);
      border: 1px solid var(--gold);
      border-radius: 4px;
      padding: 8px 12px;
      margin: 8px 0;
      text-align: center;
    }
    .belohnung p { margin: 4px 0; }
  </style>
</head>
<body>
  <header>
    <button id="zurueckknopf" class="zurueckknopf" onclick="geheZurueck()">‹ Zurück</button>
    <h1>Lern-App</h1>
    <p class="zier">❦</p>
  </header>
  <div id="punkteleiste" class="punkteleiste"></div>
  <div id="inhalt"></div>

  <script>
    // =====================================================================
    // ===== HIER NEUE THEMEN EINTRAGEN =====
    // Name der Datei im Ordner themen/ (ohne ".js").
    // Die Reihenfolge hier ist die Reihenfolge in der App.
    // In welches Fach ein Thema gehört, steht in der Themen-Datei selbst.
    const THEMEN_DATEIEN = [
      "lineare-funktionen",
      "die-zelle",
      "franzoesische-revolution",
      "industrialisierung",
      "luft-und-verbrennung",
      "englisch-wiederholung"
    ];

    // Bei JEDER Änderung an fragen.js oder an einer Themen-Datei um 1 erhöhen.
    // Dann lädt das iPhone die neuen Fassungen statt der alten aus dem Speicher.
    const VERSION = 6;
    // =====================================================================


    // ===== Laden der Dateien (hier muss normalerweise nichts geändert werden) =====
    // Für jede Datei wird ein <script>-Tag in die Seite geschrieben. Der Browser
    // lädt diese Dateien der Reihe nach und wartet jeweils, bis eine fertig ist.
    // Die App-Logik weiter unten startet deshalb erst, wenn ALLE geladen sind.
    //
    // Fehlt eine Datei oder hat sie einen Fehler, kommt aus ihr kein Thema in die
    // Liste THEMEN. Das merken wir uns, und nur dieses Thema fehlt dann.

    const THEMEN = [];       // hier hängen sich die Themen-Dateien an
    const LADEFEHLER = [];   // Hinweise für den Entwickler

    let anzahlVorher = 0;

    // Wird direkt VOR jeder Themen-Datei ausgeführt
    function vorDerDatei() {
      anzahlVorher = THEMEN.length;
    }

    // Wird direkt NACH jeder Themen-Datei ausgeführt
    function nachDerDatei(datei) {
      if (THEMEN.length === anzahlVorher) {
        LADEFEHLER.push("themen/" + datei + ".js – Datei fehlt oder enthält einen Fehler (z. B. ein Komma oder eine Klammer zu wenig).");
      }
      // Jedem neuen Thema merken, aus welcher Datei es kommt
      for (let i = anzahlVorher; i < THEMEN.length; i++) {
        if (THEMEN[i] && typeof THEMEN[i] === "object") THEMEN[i].datei = datei;
      }
    }

    // Wird direkt NACH fragen.js ausgeführt
    function nachFragen() {
      if (typeof FRAGEN === "undefined") {
        LADEFEHLER.push("fragen.js – Datei fehlt oder enthält einen Fehler. Das Gemischte Quiz ist ausgeblendet.");
      }
    }

    // Hinweis: "<\/script>" mit Schrägstrich davor, sonst denkt der Browser,
    // dieser Skript-Block hier sei schon zu Ende.
    document.write('<script src="fragen.js?v=' + VERSION + '"><\/script>');
    document.write('<script>nachFragen()<\/script>');
    THEMEN_DATEIEN.forEach((datei) => {
      document.write('<script>vorDerDatei()<\/script>');
      document.write('<script src="themen/' + datei + '.js?v=' + VERSION + '"><\/script>');
      document.write('<script>nachDerDatei("' + datei + '")<\/script>');
    });
  </script>

  <!-- Die App-Logik. Sie läuft erst, wenn alle Dateien oben geladen sind. -->
  <script>
    // ===== Einstellungen =====
    const FRAGEN_PRO_RUNDE = 10;       // wie viele Fragen pro Test/Quiz-Runde
    const RICHTIG_ZUM_ABHAKEN = 2;     // so oft hintereinander richtig, bis eine Frage als gelernt gilt
    const PUNKTE_PRO_GUTSCHEIN = 10;   // so viele Punkte ergeben einen 50-Cent-Gutschein
    const BONUS_PERFEKT = 5;           // Bonuspunkte für eine Runde ohne Fehler
    const TAGES_MAXIMUM = 15;          // höchstens so viele Punkte pro Tag
    const BESTEHEN_AB = 0.8;           // ab 80 % richtig (8 von 10) gilt ein Test als bestanden

    // Reihenfolge der Fächer auf dem Startbildschirm.
    // Fächer ohne Themen werden nicht angezeigt.
    const FAECHER = ["Mathematik", "Biologie", "Geschichte", "Chemie", "Physik", "Englisch"];

    // ===== Freundliche Rückmeldungen (eine davon wird zufällig gewählt) =====
    const LOB = ["Richtig!", "Super!", "Genau so!", "Klasse!", "Stark!"];
    const TROST = ["Noch nicht ganz – kein Problem.", "Knapp daneben – das ist okay.", "Nicht schlimm, schau mal →"];

    function zufaellig(liste) {
      return liste[Math.floor(Math.random() * liste.length)];
    }

    // ===== Hilfsfunktion: Liste zufällig mischen =====
    function mische(liste) {
      const kopie = liste.slice();
      for (let i = kopie.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [kopie[i], kopie[j]] = [kopie[j], kopie[i]];
      }
      return kopie;
    }

    function heutigesDatum() {
      const d = new Date();
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    // ===== Themen prüfen =====
    // Ein Thema mit fehlenden Teilen würde die App abstürzen lassen.
    // Deshalb wird es aussortiert, und es gibt einen Hinweis.
    function pruefeThema(thema) {
      const probleme = [];
      if (!thema || typeof thema !== "object") return ["ist kein gültiges Thema"];

      ["id", "titel", "fach"].forEach((feld) => {
        if (typeof thema[feld] !== "string") probleme.push('"' + feld + '" fehlt');
      });
      ["einfuehrung", "uebungen", "test"].forEach((feld) => {
        if (!Array.isArray(thema[feld]) || thema[feld].length === 0) probleme.push('"' + feld + '" fehlt oder ist leer');
      });
      if (probleme.length > 0) return probleme;

      thema.uebungen.concat(thema.test).forEach((f, i) => {
        const inOrdnung = f && typeof f.id === "string" && typeof f.frage === "string"
          && Array.isArray(f.antworten) && f.antworten.length === 4
          && f.richtig >= 0 && f.richtig <= 3 && typeof f.erklaerung === "string";
        if (!inOrdnung) probleme.push("Frage " + (f && f.id ? f.id : "Nr. " + (i + 1)) + " ist unvollständig");
      });
      return probleme;
    }

    function pruefeAlleThemen() {
      // Fehlerhafte Themen aussortieren
      const gueltige = THEMEN.filter((thema) => {
        const probleme = pruefeThema(thema);
        if (probleme.length > 0) {
          LADEFEHLER.push("themen/" + thema.datei + ".js – " + probleme.join(", ") + ". Das Thema wird ausgelassen.");
          return false;
        }
        return true;
      });
      THEMEN.length = 0;            // Liste leeren …
      THEMEN.push(...gueltige);     // … und nur die guten Themen wieder hinein

      // Doppelte Frage-IDs suchen (die würden den Lernstand durcheinanderbringen)
      const gesehen = {};
      const alleFragen = (typeof FRAGEN !== "undefined" ? FRAGEN : [])
        .concat(...THEMEN.map((t) => t.uebungen.concat(t.test)));
      alleFragen.forEach((f) => {
        if (gesehen[f.id]) LADEFEHLER.push("Die Frage-ID " + f.id + " kommt doppelt vor.");
        gesehen[f.id] = true;
      });

      // Hinweise zusätzlich in der Browser-Konsole ausgeben (F12 am Laptop)
      LADEFEHLER.forEach((text) => console.warn("Lern-App: " + text));
    }

    // Läuft die App gerade lokal am Laptop (Doppelklick oder Test-Server)?
    // Nur dann zeigen wir technische Hinweise an, nicht auf dem iPhone.
    function laeuftLokal() {
      return location.protocol === "file:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
    }

    // ===== Lernstand laden und speichern =====
    function ladeLernstand() {
      try {
        return JSON.parse(localStorage.getItem("lernstand")) || {};
      } catch (fehler) {
        return {};
      }
    }

    function speichereLernstand() {
      try {
        localStorage.setItem("lernstand", JSON.stringify(lernstand));
      } catch (fehler) {
        // Falls Speichern nicht klappt, läuft die App trotzdem weiter
      }
    }

    let lernstand = ladeLernstand();

    function istOffen(id) {
      return lernstand[id] && lernstand[id].offen;
    }

    function aktualisiereLernstand(id, istRichtig) {
      const eintrag = lernstand[id] || { offen: false, richtigInFolge: 0 };

      if (istRichtig) {
        eintrag.richtigInFolge++;
        if (eintrag.richtigInFolge >= RICHTIG_ZUM_ABHAKEN) {
          eintrag.offen = false;
        }
      } else {
        eintrag.offen = true;
        eintrag.richtigInFolge = 0;
      }

      lernstand[id] = eintrag;
      speichereLernstand();
    }

    // ===== Punkte laden und speichern =====
    // Gespeichert werden: Punkte insgesamt, das heutige Datum und die Punkte von heute.
    function ladePunkte() {
      let p = null;
      try {
        p = JSON.parse(localStorage.getItem("punkte"));
      } catch (fehler) {
        p = null;
      }
      if (!p) p = { gesamt: 0, tag: "", heute: 0 };
      return p;
    }

    function speicherePunkte() {
      try {
        localStorage.setItem("punkte", JSON.stringify(punktestand));
      } catch (fehler) {
        // Falls Speichern nicht klappt, läuft die App trotzdem weiter
      }
    }

    let punktestand = ladePunkte();

    // Ein neuer Tag beginnt: Tageszähler zurücksetzen
    function pruefeNeuenTag() {
      if (punktestand.tag !== heutigesDatum()) {
        punktestand.tag = heutigesDatum();
        punktestand.heute = 0;
        speicherePunkte();
      }
    }

    // Zeigt oben den Fortschrittsbalken zum nächsten Gutschein
    function zeigePunkteleiste() {
      const imBalken = punktestand.gesamt % PUNKTE_PRO_GUTSCHEIN;
      const gutscheine = Math.floor(punktestand.gesamt / PUNKTE_PRO_GUTSCHEIN);
      const prozent = imBalken / PUNKTE_PRO_GUTSCHEIN * 100;

      document.getElementById("punkteleiste").innerHTML = `
        <div class="punkte-text">
          <span>Nächster Gutschein: ${imBalken} / ${PUNKTE_PRO_GUTSCHEIN}</span>
          <span>🎟 ${gutscheine}</span>
        </div>
        <div class="balken"><div class="balken-fuellung" style="width: ${prozent}%"></div></div>`;
    }

    // Rechnet am Ende der Runde die Punkte aus und speichert sie
    function vergibPunkte() {
      pruefeNeuenTag();

      const perfekt = (punkte === runde.length);
      let verdient = punkte;
      if (perfekt) verdient += BONUS_PERFEKT;

      const nochMoeglich = Math.max(0, TAGES_MAXIMUM - punktestand.heute);
      const gutgeschrieben = Math.min(verdient, nochMoeglich);

      const gutscheineVorher = Math.floor(punktestand.gesamt / PUNKTE_PRO_GUTSCHEIN);
      punktestand.gesamt += gutgeschrieben;
      punktestand.heute += gutgeschrieben;
      speicherePunkte();
      const neueGutscheine = Math.floor(punktestand.gesamt / PUNKTE_PRO_GUTSCHEIN) - gutscheineVorher;

      return { verdient: verdient, gutgeschrieben: gutgeschrieben, perfekt: perfekt, neueGutscheine: neueGutscheine };
    }

    // ===== Themen-Fortschritt laden und speichern (Schlüssel "themenfortschritt") =====
    // Aufbau:
    //   themen:        pro Thema-ID { zuletzt: "2026-11-24", bestes: 9, von: 10 }
    //   themaDesTages: { tag: "2026-11-24", id: "lineare-funktionen" }
    function ladeFortschritt() {
      try {
        const f = JSON.parse(localStorage.getItem("themenfortschritt"));
        if (f && f.themen) return f;
      } catch (fehler) {
        // kaputte Daten: wir fangen einfach neu an
      }
      return { themen: {}, themaDesTages: null };
    }

    function speichereFortschritt() {
      try {
        localStorage.setItem("themenfortschritt", JSON.stringify(fortschritt));
      } catch (fehler) {
        // Falls Speichern nicht klappt, läuft die App trotzdem weiter
      }
    }

    let fortschritt = ladeFortschritt();

    // Merkt sich, dass ein Thema heute geübt wurde (Einführung, Übung oder Test)
    function merkeBesuch(nr) {
      const id = THEMEN[nr].id;
      const eintrag = fortschritt.themen[id] || {};
      eintrag.zuletzt = heutigesDatum();
      fortschritt.themen[id] = eintrag;
      speichereFortschritt();
    }

    // Speichert ein Testergebnis, aber nur, wenn es besser ist als das bisher beste.
    // Gibt zurück, ob es ein neuer Bestwert ist.
    function merkeTestergebnis(nr, richtig, von) {
      const id = THEMEN[nr].id;
      const eintrag = fortschritt.themen[id] || {};
      const neuerBestwert = !eintrag.von || (richtig / von > eintrag.bestes / eintrag.von);
      if (neuerBestwert) {
        eintrag.bestes = richtig;
        eintrag.von = von;
      }
      eintrag.zuletzt = heutigesDatum();
      fortschritt.themen[id] = eintrag;
      speichereFortschritt();
      return neuerBestwert;
    }

    function istBestanden(thema) {
      const eintrag = fortschritt.themen[thema.id];
      return Boolean(eintrag && eintrag.von && eintrag.bestes / eintrag.von >= BESTEHEN_AB);
    }

    // Kurzer Status-Text, z. B. "angefangen · bestes Ergebnis 6 von 10"
    function statusText(thema) {
      const eintrag = fortschritt.themen[thema.id];
      if (!eintrag) return "neu";
      let text = istBestanden(thema) ? "✓ Test bestanden" : "angefangen";
      if (eintrag.von) text += ` · bestes Ergebnis ${eintrag.bestes} von ${eintrag.von}`;
      return text;
    }

    // Unterzeile mit Status als HTML (bestandene Themen in Grün)
    function statusZeile(thema, davor) {
      const klasse = istBestanden(thema) ? ' class="bestanden"' : "";
      return `<span${klasse}>${davor}${statusText(thema)}</span>`;
    }

    // ===== Thema des Tages =====
    // Bevorzugt ein neues Thema, sonst das am längsten nicht geübte.
    // Die Wahl wird mit Datum gespeichert und ändert sich nur einmal am Tag.
    function waehleThemaDesTages() {
      if (THEMEN.length === 0) return -1;
      const heute = heutigesDatum();

      // Heute schon gewählt? Dann dabei bleiben.
      const gespeichert = fortschritt.themaDesTages;
      if (gespeichert && gespeichert.tag === heute) {
        const nr = THEMEN.findIndex((t) => t.id === gespeichert.id);
        if (nr >= 0) return nr;
      }

      // Neue Themen = Themen ohne Eintrag im Fortschritt
      const neue = [];
      THEMEN.forEach((t, nr) => { if (!fortschritt.themen[t.id]) neue.push(nr); });

      let gewaehlt;
      if (neue.length > 0) {
        gewaehlt = zufaellig(neue);
      } else {
        // Das Thema mit dem ältesten Datum "zuletzt" suchen
        gewaehlt = 0;
        THEMEN.forEach((t, nr) => {
          const datum = fortschritt.themen[t.id].zuletzt || "";
          const bisher = fortschritt.themen[THEMEN[gewaehlt].id].zuletzt || "";
          if (datum < bisher) gewaehlt = nr;
        });
      }

      fortschritt.themaDesTages = { tag: heute, id: THEMEN[gewaehlt].id };
      speichereFortschritt();
      return gewaehlt;
    }

    // ===== Bildschirm wechseln =====
    // zurueckAktion: Funktion für den "‹ Zurück"-Knopf oben links (null = Knopf ausblenden)
    let zurueckAktion = null;

    function zeigeInhalt(html, zurueck) {
      zurueckAktion = zurueck;
      document.getElementById("inhalt").innerHTML = html;
      document.getElementById("zurueckknopf").style.display = zurueck ? "block" : "none";
      window.scrollTo(0, 0);
    }

    function geheZurueck() {
      if (zurueckAktion) zurueckAktion();
    }

    // Welche Fächer haben schon Themen? (in der Reihenfolge von FAECHER,
    // unbekannte Fächer aus Themen-Dateien kommen hinten dazu)
    function faecherMitThemen() {
      const liste = FAECHER.filter((fach) => THEMEN.some((t) => t.fach === fach));
      THEMEN.forEach((t) => {
        if (!liste.includes(t.fach)) liste.push(t.fach);
      });
      return liste;
    }

    // Überschrift eines Abschnitts mit Gold-Ornament darunter
    function abschnitt(titel) {
      return `<h3 class="abschnitt">${titel}</h3><p class="zier">❦</p>`;
    }

    // ===== Startbildschirm: drei Abschnitte =====
    // 1. Thema des Tages  2. Alle Fächer  3. Gemischtes Quiz
    // Der Startbildschirm darf scrollen.
    function zeigeStart() {
      let html = "";

      // 1. Thema des Tages: oben das Fach, darunter das Thema, darunter der Status
      const tagesNr = waehleThemaDesTages();
      if (tagesNr >= 0) {
        const t = THEMEN[tagesNr];
        html += abschnitt("Thema des Tages");
        html += `<button class="tagesthema" onclick="zeigeThema(${tagesNr}, 'start')">
            <span class="tages-fach">${t.fach}</span>
            <span class="tages-titel">${t.titel}</span>
            ${statusZeile(t, "")}
          </button>`;
      }

      // 2. Alle Fächer als Kacheln
      html += abschnitt("Alle Fächer");
      html += `<div class="faecher">`;
      faecherMitThemen().forEach((fach) => {
        const themen = THEMEN.filter((t) => t.fach === fach);
        const bestanden = themen.filter(istBestanden).length;
        const wort = themen.length === 1 ? "Thema" : "Themen";
        html += `<button class="fach" onclick="zeigeFach('${fach}')">${fach}<span>${themen.length} ${wort} · ${bestanden} bestanden</span></button>`;
      });
      html += `</div>`;

      // 3. Gemischtes Quiz (nur, wenn fragen.js geladen werden konnte).
      // Die Überschrift ist schon der Titel, auf der Karte steht nur eine Beschreibung.
      if (typeof FRAGEN !== "undefined") {
        html += abschnitt("Gemischtes Quiz");
        html += `<button class="station" onclick="starteQuiz()">🎲 Zufällige Fragen aus allen Fächern</button>`;
      }

      // Hinweise bei Ladefehlern – nur am Laptop
      if (LADEFEHLER.length > 0 && laeuftLokal()) {
        html += `<div class="hinweis"><p><strong>⚠ Hinweis für den Entwickler</strong> (nur lokal sichtbar)</p>`;
        LADEFEHLER.forEach((text) => { html += `<p>• ${text}</p>`; });
        html += `</div>`;
      }

      zeigeInhalt(html, null);
    }

    // ===== Fachseite: alle Themen eines Fachs mit Status =====
    function zeigeFach(fach) {
      let html = `<p class="info">Fach</p><h2>${fach}</h2>`;
      THEMEN.forEach((t, nr) => {
        if (t.fach === fach) {
          html += `<button class="station" onclick="zeigeThema(${nr}, 'fach')">${t.titel}${statusZeile(t, "")}</button>`;
        }
      });
      zeigeInhalt(html, zeigeStart);
    }

    // ===== Themenseite: die drei Stationen eines Themas =====
    // Woher wurde das Thema geöffnet? "start" (Thema des Tages) oder "fach" (Themenliste).
    // Danach richtet sich, wohin "‹ Zurück" auf der Themenseite führt.
    let themaHerkunft = "fach";

    // herkunft wird nur beim Öffnen vom Start oder aus der Themenliste mitgegeben.
    // Kommt man aus Einführung, Übung oder Test zurück, bleibt die alte Herkunft erhalten.
    function zeigeThema(nr, herkunft) {
      if (herkunft) themaHerkunft = herkunft;
      const thema = THEMEN[nr];
      const anzahlTest = Math.min(FRAGEN_PRO_RUNDE, thema.test.length);

      const html = `<p class="info">${thema.fach}</p>
        <h2>${thema.titel}</h2>
        <p class="info">${statusText(thema)}</p>
        <button class="station" onclick="zeigeEinfuehrung(${nr}, 0)">📖 Einführung<span>Worum geht es? Mit Beispielen</span></button>
        <button class="station" onclick="starteUebung(${nr})">✏️ Übungen<span>Ohne Punkte – so oft du magst</span></button>
        <button class="station" onclick="starteTest(${nr})">🏆 Abschlusstest<span>${anzahlTest} Fragen · zählt für deine Punkte</span></button>`;

      if (themaHerkunft === "start") {
        zeigeInhalt(html, zeigeStart);
      } else {
        zeigeInhalt(html, () => zeigeFach(thema.fach));
      }
    }

    // ===== Einführung: eine Seite nach der anderen =====
    function zeigeEinfuehrung(nr, seite) {
      const thema = THEMEN[nr];
      const anzahlSeiten = thema.einfuehrung.length;
      if (seite === 0) merkeBesuch(nr);

      let html = `<p class="info">Einführung · Seite ${seite + 1} von ${anzahlSeiten}</p>`;
      html += `<div class="einfuehrung">${thema.einfuehrung[seite]}</div>`;

      // Knöpfe: "Zurück" ab Seite 2, "Weiter" bis zur vorletzten Seite, am Ende "Jetzt üben"
      html += `<div class="nav">`;
      if (seite > 0) {
        html += `<button class="weiter hell" onclick="zeigeEinfuehrung(${nr}, ${seite - 1})">Zurück</button>`;
      }
      if (seite < anzahlSeiten - 1) {
        html += `<button class="weiter" onclick="zeigeEinfuehrung(${nr}, ${seite + 1})">Weiter</button>`;
      } else {
        html += `<button class="weiter" onclick="starteUebung(${nr})">Jetzt üben</button>`;
      }
      html += `</div>`;

      zeigeInhalt(html, () => zeigeThema(nr));
    }

    // ===== Zustand der laufenden Runde =====
    let modus = "";         // "uebung", "test" oder "quiz"
    let fragenPool = [];    // alle Fragen, aus denen die Runde gezogen wird
    let themaNr = null;     // welches Thema gerade dran ist (beim Quiz: keins)
    let runde = [];         // die Fragen dieser Runde
    let aktuelleFrage = 0;
    let punkte = 0;         // richtige Antworten in dieser Runde
    let reihenfolge = [];   // gemischte Reihenfolge der Antworten
    let ergebnisse = [];

    // Die drei Wege, eine Runde zu starten
    function starteUebung(nr) { themaNr = nr;   merkeBesuch(nr); starteRunde(THEMEN[nr].uebungen, "uebung"); }
    function starteTest(nr)   { themaNr = nr;   merkeBesuch(nr); starteRunde(THEMEN[nr].test, "test"); }
    function starteQuiz()     { themaNr = null; starteRunde(FRAGEN, "quiz"); }

    function starteRunde(pool, neuerModus) {
      modus = neuerModus;
      fragenPool = pool;
      // Übung: alle Übungsfragen gemischt. Test und Quiz: 10 Fragen, offene zuerst.
      runde = (modus === "uebung") ? mische(pool) : stelleRundeZusammen(pool);
      aktuelleFrage = 0;
      punkte = 0;
      ergebnisse = [];
      zeigeFrage();
    }

    // Offene (noch nicht gelernte) Fragen kommen zuerst, der Rest wird aufgefüllt
    function stelleRundeZusammen(pool) {
      const offene = mische(pool.filter(f => istOffen(f.id)));
      const uebrige = mische(pool.filter(f => !istOffen(f.id)));
      return offene.concat(uebrige).slice(0, FRAGEN_PRO_RUNDE);
    }

    // Wohin führt "‹ Zurück" während einer Runde? Zum Thema, beim Quiz zum Start.
    function zurueckAusRunde() {
      if (themaNr !== null) zeigeThema(themaNr);
      else zeigeStart();
    }

    // ===== Eine Frage anzeigen =====
    function zeigeFrage() {
      if (aktuelleFrage >= runde.length) {
        zeigeErgebnis();
        return;
      }

      const f = runde[aktuelleFrage];

      // Was steht oben in der Infozeile?
      let bezeichnung;
      if (modus === "quiz") bezeichnung = f.epoche;
      else if (modus === "uebung") bezeichnung = "Übung";
      else bezeichnung = "Abschlusstest";

      // Die Markierung "Wiederholung" gibt es nur, wo der Lernstand zählt
      const markierung = (modus !== "uebung" && istOffen(f.id)) ? ` · <span class="badge">🔁 Wiederholung</span>` : "";

      reihenfolge = mische(f.antworten.map((antwort, i) => i));

      let html = `<p class="info">Frage ${aktuelleFrage + 1} von ${runde.length} · ${bezeichnung}${markierung}</p>`;
      html += `<h2>${f.frage}</h2>`;

      reihenfolge.forEach((original) => {
        html += `<button class="antwort" onclick="pruefeAntwort(${original})">${f.antworten[original]}</button>`;
      });

      zeigeInhalt(html, zurueckAusRunde);
    }

    function pruefeAntwort(gewaehlt) {
      const f = runde[aktuelleFrage];
      const istRichtig = (gewaehlt === f.richtig);
      if (istRichtig) punkte++;

      ergebnisse.push({ frage: f, gewaehlt: gewaehlt, istRichtig: istRichtig });

      // Übungen sollen entspannt sein: Sie verändern den Lernstand nicht
      if (modus !== "uebung") {
        aktualisiereLernstand(f.id, istRichtig);
      }

      const buttons = document.querySelectorAll(".antwort");
      buttons.forEach((button, position) => {
        const original = reihenfolge[position];
        button.disabled = true;
        if (original === f.richtig) button.classList.add("richtig");
        else if (original === gewaehlt) button.classList.add("falsch");
      });

      const rueckmeldung = istRichtig ? zufaellig(LOB) : zufaellig(TROST);
      document.getElementById("inhalt").insertAdjacentHTML("beforeend",
        `<p class="erklaerung">${rueckmeldung} ${f.erklaerung}</p>
         <button class="weiter" onclick="naechsteFrage()">Weiter</button>`);
    }

    function naechsteFrage() {
      aktuelleFrage++;
      zeigeFrage();
    }

    // ===== Ergebnis am Ende einer Runde =====

    // Liste aller Fragen der Runde mit der richtigen Antwort
    function ergebnisListe() {
      let html = "";
      ergebnisse.forEach((e) => {
        html += `<p><strong>${e.istRichtig ? "✅" : "❌"} ${e.frage.frage}</strong><br>
                 Richtige Antwort → ${e.frage.antworten[e.frage.richtig]}</p>`;
      });
      return html;
    }

    function zeigeErgebnis() {
      if (modus === "uebung") {
        zeigeUebungsErgebnis();
      } else {
        zeigeTestErgebnis();
      }
    }

    // Übung: keine Punkte, nur ein ermutigender Satz
    function zeigeUebungsErgebnis() {
      const anteil = punkte / runde.length;
      let satz;
      if (anteil === 1) satz = "Alles richtig – du bist bereit für den Abschlusstest! 🌟";
      else if (anteil >= 0.6) satz = "Schon richtig gut! Noch eine Runde, dann sitzt es.";
      else satz = "Guter Anfang! Lies dir die Erklärungen in Ruhe durch und probier es nochmal. Mit jeder Runde wird es leichter.";

      let html = `<h2>Übung geschafft! ${punkte} von ${runde.length} richtig</h2>`;
      html += `<div class="belohnung"><p>${satz}</p></div>`;
      html += ergebnisListe();
      html += `<button class="weiter" onclick="starteUebung(${themaNr})">Nochmal üben</button>`;
      html += `<button class="weiter hell" onclick="starteTest(${themaNr})">Zum Abschlusstest</button>`;
      html += `<button class="klein" onclick="zeigeThema(${themaNr})">Zum Thema</button>`;
      zeigeInhalt(html, zurueckAusRunde);
    }

    // Abschlusstest und Gemischtes Quiz: Punkte nach den bekannten Regeln
    function zeigeTestErgebnis() {
      const b = vergibPunkte();
      const nochOffen = fragenPool.filter(f => istOffen(f.id)).length;

      // Beim Abschlusstest: bestes Ergebnis des Themas merken
      let neuerBestwert = false;
      let warBestanden = false;
      if (modus === "test") {
        warBestanden = istBestanden(THEMEN[themaNr]);
        neuerBestwert = merkeTestergebnis(themaNr, punkte, runde.length);
      }

      let html = `<h2>Geschafft! ${punkte} von ${runde.length} richtig</h2>`;

      // Belohnungs-Box
      html += `<div class="belohnung">`;
      if (b.perfekt) {
        html += `<p>🌟 Perfekte Runde! +${BONUS_PERFEKT} Bonuspunkte</p>`;
      }
      if (b.gutgeschrieben > 0) {
        html += `<p><strong>+${b.gutgeschrieben} Punkte</strong></p>`;
      } else if (b.verdient === 0) {
        html += `<p>Diesmal keine Punkte – beim nächsten Mal klappt's!</p>`;
      }
      if (b.gutgeschrieben < b.verdient) {
        html += `<p class="info">Das Tagesziel ist erreicht. Weiterüben hilft trotzdem beim Lernen!</p>`;
      }
      if (b.neueGutscheine > 0) {
        html += `<p>🎉 Du hast einen neuen Gutschein verdient!</p>`;
      }
      if (modus === "test" && !warBestanden && istBestanden(THEMEN[themaNr])) {
        html += `<p>✓ Test bestanden – toll gemacht!</p>`;
      } else if (neuerBestwert && punkte > 0) {
        html += `<p>🏅 Neuer Bestwert für dieses Thema!</p>`;
      }
      html += `</div>`;

      html += `<p class="info">Noch zu üben: ${nochOffen} ${nochOffen === 1 ? "Frage" : "Fragen"}</p>`;
      html += ergebnisListe();

      html += `<button class="weiter" onclick="starteRunde(fragenPool, modus)">Nochmal</button>`;
      // Beim Abschlusstest zurück zum Thema, beim Gemischten Quiz zum Start
      if (themaNr !== null) {
        html += `<button class="weiter hell" onclick="zeigeThema(${themaNr})">Zum Thema</button>`;
      } else {
        html += `<button class="weiter hell" onclick="zeigeStart()">Zum Start</button>`;
      }
      html += `<button class="klein" onclick="zuruecksetzen()">Lernstand zurücksetzen</button>`;
      zeigeInhalt(html, zurueckAusRunde);

      zeigePunkteleiste();
    }

    function zuruecksetzen() {
      if (confirm("Lernstand wirklich löschen? (Die Punkte bleiben erhalten.)")) {
        lernstand = {};
        speichereLernstand();
        zeigeStart();
      }
    }

    // ===== Start =====
    pruefeAlleThemen();
    pruefeNeuenTag();
    zeigePunkteleiste();
    zeigeStart();
  </script>
</body>
</html>
